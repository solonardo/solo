 background:linear-gradient(100deg,#d9e2df 0%,#ffffff 40%,#ffffff 46%,#fff6d8 50%,#ffffff 54%,#c9d3d0 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}

<body>
<div id="stage">
 <div id="cam">
  <canvas id="bg" class="layer" width="1080" height="1920"></canvas>
  <svg id="world" class="layer" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
   <defs>
    <linearGradient id="gBody" x1="0" x2="1" y1="0" y2="0">
     <stop offset="0" stop-color="#010705"/><stop offset=".16" stop-color="#03221a"/><stop offset=".36" stop-color="#0a4a2c"/>

    <linearGradient id="gGlow" x1="0" x2="0" y1="0" y2="1">

    <linearGradient id="gSilver" x1="0" x2="1">

    </linearGradient>

    </linearGradient>

    </linearGradient>
    <linearGradient id="gLiqShade" x1="0" x2="1">

     <stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset=".8" stop-color="#5a2a00" stop-opacity=".2"/><stop offset="1" stop-color="#4a2000" stop-opacity=".6"/>
    </linearGradient>

<script>
// =====================================================================
//  BEAUFORT LAGER — spot 30 s, 9:16, ambiance « fraîcheur glacée »
//  Rendu déterministe : renderAt(t) dessine l'image exacte à l'instant t.
// =====================================================================
const W = 1080, H = 1920, DUR = 30;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp = (x,a=0,b=1) => Math.min(b,Math.max(a,x));
const seg = (t,a,b) => clamp((t-a)/(b-a));
const lerp = (a,b,p) => a+(b-a)*p;
const E = {
  outCubic:p=>1-Math.pow(1-p,3), inCubic:p=>p*p*p,
  inOutCubic:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  outExpo:p=>p>=1?1:1-Math.pow(2,-10*p), inExpo:p=>p<=0?0:Math.pow(2,10*p-10),
  outBack:p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)},
  inOutSine:p=>-(Math.cos(Math.PI*p)-1)/2, outQuint:p=>1-Math.pow(1-p,5),
};
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],p))).join(',')})`}
const placeT = (ax,ay,X,Y,s,rot=0) => `translate(${X.toFixed(2)},${Y.toFixed(2)}) rotate(${rot.toFixed(3)}) scale(${s.toFixed(4)}) translate(${-ax},${-ay})`;
function mapPt(ax,ay,X,Y,s,rot,x,y){const r=rot*Math.PI/180,dx=(x-ax)*s,dy=(y-ay)*s;return {x:X+dx*Math.cos(r)-dy*Math.sin(r),y:Y+dx*Math.sin(r)+dy*Math.cos(r)}}

// ---------------------------------------------------------------- emblème
function lionSVG(cx,cy,r){
  const star=(n,ro,ri,rot)=>{const p=[];for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n-Math.PI/2,rr=i%2?ri:ro;p.push((cx+Math.cos(a)*rr).toFixed(2)+','+(cy+Math.sin(a)*rr).toFixed(2))}return p.join(' ')};
  const sw=r*.025, dk='#4a2f04';
  let s=`<polygon points="${star(16,r,r*.7,0)}" fill="url(#gGold)" stroke="${dk}" stroke-width="${sw}"/>`;
  s+=`<polygon points="${star(16,r*.86,r*.6,Math.PI/16)}" fill="#c48a19" stroke="${dk}" stroke-width="${sw*.8}"/>`;
  for(const k of [-1,1]) s+=`<circle cx="${cx+k*r*.36}" cy="${cy-r*.42}" r="${r*.13}" fill="url(#gGold)" stroke="${dk}" stroke-width="${sw}"/>`;
  s+=`<path d="M${cx-r*.42},${cy-r*.26} Q${cx},${cy-r*.64} ${cx+r*.42},${cy-r*.26} Q${cx+r*.5},${cy+r*.25} ${cx},${cy+r*.6} Q${cx-r*.5},${cy+r*.25} ${cx-r*.42},${cy-r*.26} Z" fill="url(#gGold)" stroke="${dk}" stroke-width="${sw}"/>`;
  for(const k of [-1,1]){const x=cx+k*r*.18,y=cy-r*.07;
    s+=`<path d="M${x-r*.1},${y} Q${x},${y-r*.08} ${x+r*.1},${y} Q${x},${y+r*.05} ${x-r*.1},${y} Z" fill="#3a2503"/>`;
    s+=`<path d="M${cx+k*r*.32},${cy-r*.2} Q${cx+k*r*.16},${cy-r*.3} ${cx+k*r*.04},${cy-r*.16}" stroke="${dk}" stroke-width="${sw*1.2}" fill="none"/>`;
    s+=`<path d="M${cx+k*r*.06},${cy-r*.04} L${cx+k*r*.1},${cy+r*.13}" stroke="${dk}" stroke-width="${sw}" fill="none"/>`;}
  s+=`<path d="M${cx-r*.12},${cy+r*.13} L${cx+r*.12},${cy+r*.13} L${cx},${cy+r*.28} Z" fill="#3a2503"/>`;
  s+=`<path d="M${cx},${cy+r*.28} L${cx},${cy+r*.37} M${cx-r*.16},${cy+r*.44} Q${cx},${cy+r*.33} ${cx+r*.16},${cy+r*.44}" stroke="#3a2503" stroke-width="${sw*1.3}" fill="none"/>`;
  return s;
}

// ---------------------------------------------------------------- bouteille
const BPATH = "M124,36 L176,36 L178,64 L180,300 C182,382 260,420 260,522 L260,946 Q260,986 222,989 L78,989 Q40,986 40,946 L40,522 C40,420 118,382 120,300 L122,64 Z";
$('bClipPath').setAttribute('d',BPATH);
$('hitPath').setAttribute('d',BPATH);

function capSVG(){
  let z='M117,30';
  for(let i=0;i<=12;i++){const x=117+i*(66/12);z+=` L${x.toFixed(1)},${i%2?39:33}`}
  z+=' L183,30 Z';
  return `<path d="${z}" fill="url(#gSilver)"/>
   <path d="M117,33 L117,12 Q117,4 126,4 L174,4 Q183,4 183,12 L183,33 Z" fill="url(#gCap)"/>
   <rect x="121" y="5" width="58" height="4" rx="2" fill="#bff5d6" opacity=".55"/>
   <rect x="117" y="27" width="66" height="3" fill="#d9b04a" opacity=".9"/>`;
}

function bottleSVG(p){
  return `
  <rect x="119" y="20" width="62" height="20" rx="7" fill="url(#gBody)" stroke="rgba(200,255,230,.35)" stroke-width="1.5"/>
  <path d="${BPATH}" fill="url(#gBody)"/>
  <path d="${BPATH}" fill="url(#gGlow)"/>
  <g clip-path="url(#bClip)">
    <path d="M0,40 L300,40 L300,330 Q150,394 0,330 Z" fill="url(#gFoil)"/>
    <path d="M30,332 Q150,392 270,332" fill="none" stroke="#d9b04a" stroke-width="2.2"/>
    <g>${lionSVG(150,118,17)}</g>
    <text x="150" y="208" font-family="Fraktur" font-weight="700" font-size="22" text-anchor="middle" textLength="50" lengthAdjust="spacingAndGlyphs" fill="#f2f6f3">Beaufort</text>
    <rect x="0" y="246" width="300" height="2" fill="#d9b04a"/>
    <rect x="0" y="250" width="300" height="26" fill="url(#gSilver)"/>
    <rect x="0" y="278" width="300" height="2" fill="#d9b04a"/>
    <text x="150" y="268" font-family="Oswald" font-weight="500" font-size="11" letter-spacing="3" text-anchor="middle" fill="#0d2418">LAGER</text>
    <rect x="0" y="856" width="300" height="2.5" fill="#d9b04a"/>
    <rect x="0" y="859" width="300" height="44" fill="url(#gSilver)"/>
    <rect x="0" y="903" width="300" height="2.5" fill="#d9b04a"/>
    <text x="150" y="887" font-family="Oswald" font-weight="500" font-size="14" letter-spacing="4" text-anchor="middle" fill="#13261c">BIÈRE BLONDE · LAGER</text>
    <ellipse cx="150" cy="742" rx="105" ry="133" fill="url(#gSilver)"/>
    <ellipse cx="150" cy="742" rx="99" ry="127" fill="url(#gLabel)"/>
    <ellipse cx="150" cy="742" rx="90" ry="118" fill="none" stroke="#d9a93a" stroke-width="1.4" opacity=".85"/>
    <g>${lionSVG(150,668,31)}</g>
    <text x="150" y="772" font-family="Fraktur" font-weight="700" font-size="58" text-anchor="middle" textLength="176" lengthAdjust="spacingAndGlyphs" fill="#f4f6f2" stroke="#000" stroke-width=".6">Beaufort</text>
    <text x="153" y="808" font-family="Oswald" font-weight="500" font-size="18" letter-spacing="7" text-anchor="middle" fill="url(#gGold)">LAGER</text>
    <path d="M110,826 L190,826" stroke="#d9a93a" stroke-width="1" opacity=".7"/>
    <circle cx="150" cy="826" r="2.5" fill="#d9a93a"/>
    <rect x="0" y="0" width="300" height="1000" fill="url(#gCyl)"/>
    <rect x="58" y="380" width="17" height="570" fill="url(#gSpec)" opacity=".85"/>
    <rect x="84" y="430" width="5" height="500" fill="url(#gSpec)" opacity=".45"/>
    <rect x="224" y="440" width="9" height="480" fill="url(#gSpec)" opacity=".35"/>
    <rect x="130" y="60" width="7" height="250" fill="url(#gSpec)" opacity=".75"/>
    <path d="${BPATH}" fill="none" stroke="rgba(170,255,220,.22)" stroke-width="16"/>
    <rect id="${p}frost" x="0" y="0" width="300" height="1000" filter="url(#fFrost)" opacity=".5"/>
    <rect id="${p}sweep" x="-80" y="-100" width="150" height="1200" fill="url(#gSweep)"/>
    <g id="${p}drops"></g>
    <g id="${p}drips"></g>
  </g>
  <path d="${BPATH}" fill="none" stroke="url(#gRim)" stroke-width="2.6"/>
  <g id="${p}cap">${capSVG()}</g>`;
}
$('mb').innerHTML = bottleSVG('mb');
$('pb').innerHTML = bottleSVG('pb');

// gouttelettes de condensation
function makeDrops(group, n, seed, inside){
  const r = mulberry32(seed), out=[];
  let guard=0;
  while(out.length<n && guard++<20000){
    const x=r()*300, y=40+r()*960;
    if(!inside(x,y)) continue;
    const big = r()<.1;
    const rx = big ? 5.5+r()*3.5 : 1.3+r()*3.6, ry = rx*(1.05+r()*.3);
    const g = el('g',{},group);
    el('ellipse',{cx:0,cy:0,rx,ry,fill:'rgba(210,255,235,.06)',stroke:'rgba(255,255,255,.26)','stroke-width':.7},g);
    el('ellipse',{cx:rx*.15,cy:ry*.45,rx:rx*.55,ry:ry*.3,fill:'rgba(0,20,10,.25)'},g);
    el('circle',{cx:-rx*.35,cy:-ry*.38,r:Math.max(.5,rx*.28),fill:'rgba(255,255,255,.9)'},g);
    out.push({g,x,y,off:r(),rx});
  }
  return out;
}
const hit = $('hitPath');
const inBottle = (x,y)=> y>58 && hit.isPointInFill(new DOMPoint(x,y)) && !(y>240&&y<282);
const DROPS = { mb: makeDrops($('mbdrops'),150,11,inBottle), pb: makeDrops($('pbdrops'),120,23,inBottle) };

// coulures
function makeDrips(group, seed){
  const r=mulberry32(seed), out=[];
  for(let i=0;i<7;i++){
    const x=60+r()*180, y0=420+r()*300, len=140+r()*260, rx=4+r()*2.5;
    const trail=el('path',{d:'',stroke:'rgba(230,255,245,.22)','stroke-width':rx*1.1,'stroke-linecap':'round',fill:'none'},group);
    const g=el('g',{},group);

    T.el.style.opacity=(1-q).toFixed(3);
    T.el.style.filter=(T.glow+(q>.01?` blur(${(q*16).toFixed(1)}px)`:'')).trim()||'none';
    T.el.style.transform=`translateY(${(-q*50).toFixed(1)}px) scale(${(1+q*.05).toFixed(4)})`;
    T.units.forEach((u,i)=>{
      const p=seg(t,T.tin+i*T.stagger,T.tin+i*T.stagger+T.dur);
      let tr='',op=1,bl=0;
      if(T.mode==='rise'){const e=E.outExpo(p);tr=`translateY(${((1-e)*.6).toFixed(3)}em) rotate(${((1-e)*6).toFixed(2)}deg)`;op=E.outCubic(p);bl=(1-e)*10}
      else if(T.mode==='blur'){const e=E.outCubic(p);tr=`scale(${(1.25-.25*e).toFixed(4)})`;op=e;bl=(1-e)*18}
      else if(T.mode==='punch'){const e=E.outBack(p);tr=`scale(${(1.9-.9*e).toFixed(4)})`;op=E.outCubic(seg(p,0,.35));bl=(1-E.outCubic(p))*18}
      u.style.transform=tr;u.style.opacity=op.toFixed(3);u.style.filter=bl>.05?`blur(${bl.toFixed(1)}px)`:'none';
    });
  }

  if(t>=20.2&&t<=23.85){
    const p=E.outCubic(seg(t,20.35,22.3)), v=Math.round(lerp(28,4,p));
    TEMP.el.firstChild.textContent=v+'°C';

    const gl=p<.5?'rgba(255,150,50,.6)':'rgba(120,225,255,.65)';
    const base=`drop-shadow(0 0 ${(30+20*Math.sin(p*Math.PI)).toFixed(0)}px ${gl}) drop-shadow(0 6px 18px rgba(0,0,0,.7))`;
    const q=E.inCubic(seg(t,23.5,23.85));
    TEMP.el.style.filter=base+(q>.01?` blur(${(q*16).toFixed(1)}px)`:'');
    const kick=p<1?Math.sin(t*40)*(1-p)*3:0;
    TEMP.el.style.transform=`translateX(${kick.toFixed(1)}px) scale(${(1+q*.05).toFixed(3)})`;
  }
}

    const px=r()*540, py=bottom?600+Math.pow(r(),.6)*420:r()*960, rad=40+r()*170;
    const g=x.createRadialGradient(px,py,0,px,py,rad);
    const a=(bottom?.07:.05)+r()*.06;
    g.addColorStop(0,`rgba(215,245,255,${a})`);g.addColorStop(1,'rgba(215,245,255,0)');
    x.fillStyle=g;x.fillRect(px-rad,py-rad,rad*2,rad*2);
  }
  return c;
}
const FOG_FULL=makeFog(3,false), FOG_LOW=makeFog(8,true);
const SCENES=[
  {t:0,   core:'#0c3c42',mid:'#03151a',cy:960, r:1250,ray:.35,fog:FOG_FULL,mist:.45},
  {t:5.8, core:'#137449',mid:'#03251a',cy:880, r:1250,ray:1,  fog:FOG_LOW, mist:.75},
  {t:11.95,core:'#94600f',mid:'#1e2a10',cy:900,r:1150,ray:.75,fog:FOG_LOW, mist:.25},
  {t:19.95,core:'#10664a',mid:'#031d14',cy:1000,r:1300,ray:.55,fog:FOG_FULL,mist:.3},
  {t:23.95,core:'#16855d',mid:'#042b1e',cy:1080,r:1350,ray:1, fog:FOG_LOW, mist:.95},
  {t:28.0,core:'#0e5638',mid:'#03180f',cy:860, r:1250,ray:.6, fog:FOG_FULL,mist:.35},
];
function renderBG(t){
  let S=SCENES[0];for(const s of SCENES)if(t>=s.t)S=s;
  let core=S.core;
  if(S===SCENES[0]) core=mix('#061e22',S.core,seg(t,0,5.5));
  const g=bg.createRadialGradient(540,S.cy,0,540,S.cy,S.r);
  g.addColorStop(0,core);g.addColorStop(.42,S.mid);g.addColorStop(1,'#000');
  bg.globalCompositeOperation='source-over';bg.fillStyle=g;bg.fillRect(0,0,W,H);
  // faisceaux lumineux
  bg.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){
    const a=Math.PI/2+(i-3)*.17+Math.sin(t*.35+i*1.7)*.035, ox=540+(i-3)*70, w=.035+.02*Math.sin(i*2.3);
    const lg=bg.createLinearGradient(ox,-120,ox+Math.cos(a)*2200,-120+Math.sin(a)*2200);
    const al=S.ray*(.05+.03*Math.sin(t*.9+i));
    lg.addColorStop(0,`rgba(190,250,255,${al})`);lg.addColorStop(.6,`rgba(190,250,255,${al*.25})`);lg.addColorStop(1,'rgba(190,250,255,0)');
    bg.fillStyle=lg;bg.beginPath();bg.moveTo(ox,-120);
    bg.lineTo(ox+Math.cos(a-w)*2400,-120+Math.sin(a-w)*2400);bg.lineTo(ox+Math.cos(a+w)*2400,-120+Math.sin(a+w)*2400);bg.closePath();bg.fill();
  }
  bg.globalCompositeOperation='source-over';
  // brume
  const o=(t*22)%1080;
  bg.globalAlpha=S.mist;
  bg.drawImage(S.fog,-o,0,1080,1920);bg.drawImage(S.fog,1080-o,0,1080,1920);
  bg.globalAlpha=S.mist*.6;
  bg.save();bg.scale(-1,1);const o2=(t*14)%1080;bg.drawImage(S.fog,-1080-o2,40,1080,1920);bg.drawImage(S.fog,-o2,40,1080,1920);bg.restore();
  bg.globalAlpha=1;
}

// ---------------------------------------------------------------- effets
const fx=$('fx').getContext('2d');
// givre : dendrites qui poussent depuis les bords
const FROST=[];
(function(){
  const r=mulberry32(77);
  const seeds=[[0,0,.6],[1080,0,2.3],[0,1920,-.7],[1080,1920,-2.4],[0,520,0],[1080,780,Math.PI],[0,1250,.1],[1080,1420,3.0],[380,0,1.5],[760,1920,-1.6],[260,1920,-1.4],[820,0,1.7],[0,1650,-.3],[1080,300,2.9]];
  let budget=0;
  function grow(x,y,a,len,depth,birth){
    if(depth>5.5||len<7||budget<=0)return;
    budget--;
    const x2=x+Math.cos(a)*len,y2=y+Math.sin(a)*len,dur=len/150;
    FROST.push({x,y,x2,y2,b:birth,d:dur,depth});
    const nb=birth+dur;
    grow(x2,y2,a+(r()-.5)*.35,len*.88,depth+.5,nb);
    if(r()<.85)grow(x2,y2,a+Math.PI/3+(r()-.5)*.2,len*.5,depth+1,nb);
    if(r()<.85)grow(x2,y2,a-Math.PI/3+(r()-.5)*.2,len*.5,depth+1,nb);
  }
  seeds.forEach(([x,y,a],i)=>{for(let k=0;k<3;k++){budget=110;grow(x,y,a+(k-1)*.45+(r()-.5)*.2,70+r()*40,0,.2+r()*1.2)}});
})();
const CRACKS=[];
(function(){const r=mulberry32(5);for(let i=0;i<11;i++){let a=i/11*Math.PI*2+r()*.3,x=540,y=980,pts=[[x,y]];for(let k=0;k<9;k++){a+=(r()-.5)*.6;const l=60+r()*90;x+=Math.cos(a)*l;y+=Math.sin(a)*l;pts.push([x,y])}CRACKS.push({pts,d:r()*.15})}})();
const SHARDS=[];
(function(){const r=mulberry32(13);for(let i=0;i<110;i++){const cx=r()*1080,cy=r()*1920,n=3+Math.floor(r()*3),rad=40+r()*150,pts=[];for(let k=0;k<n;k++){const a=k/n*Math.PI*2+r()*.8;pts.push([Math.cos(a)*rad*(.6+r()*.4),Math.sin(a)*rad*(.6+r()*.4)])}
  const dx=cx-540,dy=cy-980,dd=Math.hypot(dx,dy)+1;SHARDS.push({cx,cy,pts,vx:dx/dd*(500+r()*1300),vy:dy/dd*(500+r()*1300)-200,vr:(r()-.5)*8,z:1+r()*1.5})}})();
const DUST=[];
(function(){const r=mulberry32(55);for(let i=0;i<130;i++)DUST.push({x:r()*1080,y:r()*1920,r:i<18?18+r()*50:.8+r()*2.8,a:i<18?.03+r()*.06:.25+r()*.6,sp:12+r()*45,ph:r()*6.28,big:i<18})})();
const VAPOR=[];
(function(){const r=mulberry32(91);for(let i=0;i<170;i++)VAPOR.push({b:11.0+Math.pow(r(),1.8)*.6,vx:(r()-.5)*240,vy:-(300+r()*1100),r0:6+r()*10,gr:40+r()*110,a:.035+r()*.05,life:.7+r()*.6})})();
const SPL=[];
(function(){const r=mulberry32(17);for(let i=0;i<70;i++)SPL.push({ph:r(),vx:(r()-.5)*260,vy:-(120+r()*320),r:1.5+r()*3.5,per:.35+r()*.4})})();
const GLINTS=[[24.9,330,700,70],[25.4,700,1000,55],[25.9,470,1180,60],[26.6,880,960,45],[27.2,305,540,50],[28.9,770,780,70],[29.3,300,840,55],[29.6,540,560,60],[8.9,420,560,60],[9.6,640,980,45],[18.6,380,760,55],[19.2,700,1100,45],[21.8,700,900,55],[22.8,380,1240,45]];

function star(c,x,y,s,a,rot){
  c.save();c.translate(x,y);c.rotate(rot);c.globalAlpha=a;
  const g=c.createRadialGradient(0,0,0,0,0,s*.5);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(200,245,255,0)');
  c.fillStyle=g;c.beginPath();c.arc(0,0,s*.5,0,7);c.fill();
  c.fillStyle='#fff';
  for(let k=0;k<2;k++){c.beginPath();c.moveTo(-s,0);c.quadraticCurveTo(0,-s*.05,s,0);c.quadraticCurveTo(0,s*.05,-s,0);c.fill();c.rotate(Math.PI/2)}
  c.restore();
}

function renderFX(t){
  fx.clearRect(0,0,W,H);
  // --- givre plein écran (scène 1)
  if(t<5.8){
    const k=seg(t,.1,5.6);
    const hz=fx.createRadialGradient(540,980,lerp(900,330,E.inOutSine(k)),540,980,1250);
    hz.addColorStop(0,'rgba(220,248,255,0)');hz.addColorStop(1,`rgba(220,248,255,${(.42*k).toFixed(3)})`);
    fx.fillStyle=hz;fx.fillRect(0,0,W,H);
    fx.lineCap='round';
    for(const s of FROST){
      if(t<s.b)continue;
      const p=clamp((t-s.b)/s.d);
      fx.strokeStyle=`rgba(235,252,255,${(.75-s.depth*.08).toFixed(3)})`;
      fx.lineWidth=Math.max(.6,3.2-s.depth*.45);
      fx.beginPath();fx.moveTo(s.x,s.y);fx.lineTo(lerp(s.x,s.x2,p),lerp(s.y,s.y2,p));fx.stroke();
    }
    // fissures
    if(t>4.95){
      fx.save();fx.shadowColor='rgba(180,240,255,.9)';fx.shadowBlur=14;
      for(const c of CRACKS){
        const p=E.outCubic(seg(t,4.95+c.d,5.65+c.d)),n=c.pts.length-1,m=p*n;
        fx.strokeStyle='rgba(255,255,255,.95)';fx.lineWidth=3;fx.beginPath();fx.moveTo(c.pts[0][0],c.pts[0][1]);
        for(let i=1;i<=n;i++){if(i<=m)fx.lineTo(c.pts[i][0],c.pts[i][1]);else{const f=m-(i-1);if(f>0)fx.lineTo(lerp(c.pts[i-1][0],c.pts[i][0],f),lerp(c.pts[i-1][1],c.pts[i][1],f));break}}
        fx.stroke();
      }
      fx.restore();
    }
  }
  // --- éclats de glace
  if(t>=5.8&&t<7.3){
    const lt=t-5.8, a=1-seg(t,6.3,7.25);
    for(const s of SHARDS){
      const x=s.cx+s.vx*lt, y=s.cy+s.vy*lt+600*lt*lt, z=1+(s.z-1)*E.outCubic(seg(lt,0,1.2));
      fx.save();fx.translate(x,y);fx.rotate(s.vr*lt);fx.scale(z,z);fx.globalAlpha=a;
      fx.beginPath();s.pts.forEach((p,i)=>i?fx.lineTo(p[0],p[1]):fx.moveTo(p[0],p[1]));fx.closePath();
      fx.fillStyle='rgba(215,248,255,.2)';fx.fill();fx.strokeStyle='rgba(255,255,255,.75)';fx.lineWidth=1.6/z;fx.stroke();
      fx.beginPath();fx.moveTo(s.pts[0][0]*.6,s.pts[0][1]*.6);fx.lineTo(s.pts[1][0]*.6,s.pts[1][1]*.6);fx.strokeStyle='rgba(255,255,255,.5)';fx.stroke();
      fx.restore();
    }
  }
  // --- vapeur de CO2 au décapsulage
  if(t>=11.0&&t<12.05&&MOUTH){
    for(const v of VAPOR){
      const lt=t-v.b;if(lt<0||lt>v.life)continue;
      const p=lt/v.life, dec=1-Math.exp(-lt*3.2);
      const y=MOUTH.y+v.vy*dec/2.2, x=MOUTH.x+v.vx*dec/2.2*(.3+p)+Math.sin(lt*7+v.vx)*18*p;
      const rad=v.r0+v.gr*E.outCubic(p), al=v.a*(1-p)*Math.min(1,lt*12);
      const g=fx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,`rgba(230,252,255,${al.toFixed(3)})`);g.addColorStop(1,'rgba(230,252,255,0)');
      fx.fillStyle=g;fx.fillRect(x-rad,y-rad,rad*2,rad*2);
    }
  }
  // --- éclaboussures du service
  if(window.SPLASH&&SPLASH.w>0){
    for(const s of SPL){
      const lt=((t+s.ph*s.per)%s.per), x=SPLASH.x+s.vx*lt, y=SPLASH.y+s.vy*lt+1400*lt*lt;
      if(y>SPLASH.y+30)continue;
      fx.fillStyle=`rgba(255,${200+Math.floor(s.ph*50)},120,${(.75*(1-lt/s.per)*SPLASH.w).toFixed(3)})`;
      fx.beginPath();fx.arc(x,y,s.r,0,7);fx.fill();
      fx.fillStyle=`rgba(255,255,255,${(.6*(1-lt/s.per)*SPLASH.w).toFixed(3)})`;fx.beginPath();fx.arc(x-s.r*.3,y-s.r*.3,s.r*.35,0,7);fx.fill();
    }
  }
  // --- poussière de glace / bokeh
  fx.globalCompositeOperation='lighter';
  for(const d of DUST){
    const y=((d.y-t*d.sp)%1920+1920)%1920, x=d.x+Math.sin(t*.6+d.ph)*25;
    const tw=d.big?1:.5+.5*Math.sin(t*3+d.ph*5);
    const warm=t>=11.95&&t<20;
    if(d.big){const g=fx.createRadialGradient(x,y,0,x,y,d.r);g.addColorStop(0,warm?`rgba(255,215,140,${d.a})`:`rgba(190,245,255,${d.a})`);g.addColorStop(.7,warm?`rgba(255,215,140,${d.a*.6})`:`rgba(190,245,255,${d.a*.6})`);g.addColorStop(1,'rgba(0,0,0,0)');fx.fillStyle=g;fx.fillRect(x-d.r,y-d.r,d.r*2,d.r*2)}
    else{fx.fillStyle=`rgba(225,250,255,${(d.a*tw).toFixed(3)})`;fx.beginPath();fx.arc(x,y,d.r,0,7);fx.fill()}
  }
  fx.globalCompositeOperation='source-over';
  // --- étincelles
  for(const [gt,x,y,s] of GLINTS){const p=seg(t,gt,gt+.6);if(p<=0||p>=1)continue;star(fx,x,y,s*Math.sin(p*Math.PI),Math.sin(p*Math.PI),p*1.2)}
}

// ---------------------------------------------------------------- carton final
$('endSvg').innerHTML = `<g id="endLion">${lionSVG(540,560,120)}</g>
 <path id="endRule" d="M300,1250 L780,1250" stroke="url(#gGold)" stroke-width="2"/>`;
function renderEnd(t){

  $('end').style.display=on?'block':'none';if(!on)return;
  const pL=E.outBack(seg(t,28.05,28.75));

  w.style.filter=`drop-shadow(0 0 26px rgba(150,230,255,.35)) drop-shadow(0 8px 20px rgba(0,0,0,.7))`;

  f('endLager',28.7,29.2,30);f('endSlogan',28.95,29.5,30);f('endServe',29.2,29.7,20);
  $('endRule').setAttribute('opacity',E.outCubic(seg(t,29.1,29.6)).toFixed(3));
  $('endRule').setAttribute('transform',`translate(540,0) scale(${E.outCubic(seg(t,29.1,29.7)).toFixed(3)},1) translate(-540,0)`);
}

// ---------------------------------------------------------------- post-prod
const post=$('post').getContext('2d');
const GRAIN=[];
for(let k=0;k<4;k++){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),d=x.createImageData(256,256),r=mulberry32(900+k);
  for(let i=0;i<d.data.length;i+=4){const v=Math.floor(r()*255);d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);GRAIN.push(c)}
function renderPost(t){
  post.clearRect(0,0,W,H);
  const v=post.createRadialGradient(540,900,420,540,960,1250);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.7)');
  post.fillStyle=v;post.fillRect(0,0,W,H);
  // lisibilité de la mention légale

  post.fillStyle=lg;post.fillRect(0,1640,W,280);
  const fr=Math.round(t*30), r=mulberry32(fr+1);

  const tile=GRAIN[fr%4], ox=Math.floor(r()*256), oy=Math.floor(r()*256);
  for(let y=-oy;y<H;y+=256)for(let x=-ox;x<W;x+=256)post.drawImage(tile,x,y);

// ---------------------------------------------------------------- caméra / transitions
const CUTS=[11.95,20.0,24.0,28.0];
const IMPACTS=[[5.8,26],[11.0,12],[12.0,6],[24.0,14],[28.0,10]];
function renderCam(t){
  let blur=0,dy=0,flash=0;
  for(const c of CUTS){const a=1-Math.abs(t-c)/.13;if(a>0){blur=Math.max(blur,a*24);dy+=(t<c?-1:1)*E.inCubic(a)*300;flash=Math.max(flash,a*.3)}}
  let sx=0,sy=0;
  for(const [ti,amp] of IMPACTS){if(t>=ti){const k=t-ti,d=Math.exp(-k*7)*amp;sx+=Math.sin(k*73)*d;sy+=Math.cos(k*61)*d}}
  const push=1+.025*((t%4)/4);
  $('cam').style.transform=`translate(${sx.toFixed(2)}px,${(sy+dy).toFixed(2)}px) scale(${push.toFixed(4)})`;
  $('cam').style.filter=blur>.2?`blur(${blur.toFixed(1)}px)`:'none';
  if(t>=5.8)flash=Math.max(flash,.95*Math.pow(1-seg(t,5.8,6.35),2));
  if(t>=11.0)flash=Math.max(flash,.3*Math.pow(1-seg(t,11.0,11.25),2));
  if(t>=24.0)flash=Math.max(flash,.5*Math.pow(1-seg(t,24.0,24.4),2));
  if(t>=28.0)flash=Math.max(flash,.75*Math.pow(1-seg(t,28.0,28.45),2));
  $('flash').style.opacity=flash.toFixed(3);
  $('black').style.opacity=(1-E.outCubic(seg(t,0,.8))).toFixed(3);
  $('legal').style.opacity=E.outCubic(seg(t,.4,1.2)).toFixed(3);
}

function renderAt(t){
  t=Math.min(Math.max(t,0),DUR-1e-4);
  renderBG(t);renderWorld(t);renderFX(t);renderText(t);renderEnd(t);renderPost(t);renderCam(t);
}
window.renderAt=renderAt;
window.ready=Promise.all([
  document.fonts.load('700 50px Fraktur'),document.fonts.load('700 50px Oswald'),document.fonts.load('500 50px Oswald'),
  document.fonts.load('italic 500 50px Cormorant'),document.fonts.load('600 20px Inter'),
]).then(()=>document.fonts.ready).then(()=>{renderAt(0);return true});

// aperçu dans le navigateur : lecture en temps réel (désactivé pendant le rendu)
if(!location.search.includes('render')){
  const st=$('stage');const fit=()=>{const k=Math.min(innerWidth/W,innerHeight/H);st.style.transform=`scale(${k})`;st.style.transformOrigin='0 0'};
  document.body.style.overflow='hidden';
  window.ready.then(()=>{fit();addEventListener('resize',fit);const t0=performance.now();(function loop(){renderAt(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop)})()});
}
